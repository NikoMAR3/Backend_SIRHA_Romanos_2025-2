spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}

server:
  port: ${PORT:8080}
  compression:
    enabled: true

logging:
  level:
    root: WARN
    edu.dosw.sirha: INFO
  file:
    name: logs/sirha-api.log
    max-size: 10MB
    max-history: 30

springdoc:
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always