# Configuración directa - sin variables de entorno
spring.data.mongodb.uri=mongodb://admin:password@localhost:27017/sirha_test?authSource=admin
spring.data.mongodb.database=sirha_test

# Desactivar seguridad
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Aumentar timeout
spring.data.mongodb.client.timeout=10000