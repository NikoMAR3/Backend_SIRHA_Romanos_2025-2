name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - main
      - feature/**
  pull_request:
    branches:
      - develop
      - main

env:
  DOCKER_IMAGE: sirha-api
  KUBERNETES_NAMESPACE: sirha
  AZURE_WEBAPP_NAME: sirha-backend-api
  JAVA_VERSION: '17'

jobs:
  # ============================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build with Maven
        run: mvn clean compile -DskipTests

      - name: Run tests
        run: mvn test

      - name: Generate JaCoCo coverage report
        run: mvn jacoco:report

      - name: SonarCloud Scan
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=ROMANOS-SIHRA_Backend_SIRHA_Romanos_2025-2 \
            -Dsonar.organization=romanos-sihra \
            -Dsonar.host.url=https://sonarcloud.io

      - name: Package application
        run: mvn package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: sirha-api-jar
          path: target/*.jar
          retention-days: 7

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 7

  # ============================================
  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: sirha-api-jar
          path: target/

      - name: Build Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:latest .
          docker tag ${{ env.DOCKER_IMAGE }}:latest ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Save Docker image
        run: docker save ${{ env.DOCKER_IMAGE }}:latest | gzip > sirha-api-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: sirha-api-image.tar.gz
          retention-days: 1

  # ============================================
  deploy-kubernetes-local:
    name: Deploy to Kubernetes Local
    runs-on: ubuntu-latest
    needs: build-docker-image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load < sirha-api-image.tar.gz

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Create kubeconfig for local cluster
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_LOCAL }}" | base64 -d > $HOME/.kube/config

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f k8s/mongodb-deployment.yaml
          kubectl apply -f k8s/mongodb-service.yaml
          kubectl apply -f k8s/api-deployment.yaml
          kubectl apply -f k8s/api-service.yaml

      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/sirha-api -n ${{ env.KUBERNETES_NAMESPACE }} --timeout=5m

      - name: Get deployment status
        run: |
          kubectl get pods -n ${{ env.KUBERNETES_NAMESPACE }}
          kubectl get svc -n ${{ env.KUBERNETES_NAMESPACE }}

      - name: Health check
        id: health_check
        run: |
          echo "Esperando 30 segundos para que la aplicación inicie..."
          sleep 30
          
          MAX_RETRIES=10
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Intento $((RETRY_COUNT + 1)) de $MAX_RETRIES..."
          
            POD_NAME=$(kubectl get pods -n ${{ env.KUBERNETES_NAMESPACE }} -l app=sirha-api -o jsonpath='{.items[0].metadata.name}')
          
            if kubectl exec -n ${{ env.KUBERNETES_NAMESPACE }} $POD_NAME -- curl -f http://localhost:8080/actuator/health; then
              echo "Health check exitoso"
              echo "status=success" >> $GITHUB_OUTPUT
              exit 0
            fi
          
            RETRY_COUNT=$((RETRY_COUNT + 1))
            sleep 10
          done
          
          echo "Health check falló después de $MAX_RETRIES intentos"
          echo "status=failed" >> $GITHUB_OUTPUT
          exit 1

      - name: Rollback on failure
        if: steps.health_check.outputs.status == 'failed'
        run: |
          echo "Iniciando rollback automático..."
          kubectl rollout undo deployment/sirha-api -n ${{ env.KUBERNETES_NAMESPACE }}
          kubectl rollout status deployment/sirha-api -n ${{ env.KUBERNETES_NAMESPACE }}

      - name: Get logs on failure
        if: failure()
        run: |
          echo "Logs de pods fallidos:"
          kubectl logs -n ${{ env.KUBERNETES_NAMESPACE }} -l app=sirha-api --tail=100

  # ============================================
  deploy-azure-production:
    name: Deploy to Azure Production
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://sirha-backend-api.azurewebsites.net

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: sirha-api-jar
          path: target/

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: target/*.jar

      - name: Health check Azure
        id: azure_health
        run: |
          echo "Esperando 60 segundos para que Azure inicie la aplicación..."
          sleep 60
          
          MAX_RETRIES=10
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Intento $((RETRY_COUNT + 1)) de $MAX_RETRIES..."
          
            if curl -f https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/actuator/health; then
              echo "Azure health check exitoso"
              echo "status=success" >> $GITHUB_OUTPUT
              exit 0
            fi
          
            RETRY_COUNT=$((RETRY_COUNT + 1))
            sleep 15
          done
          
          echo "Azure health check falló"
          echo "status=failed" >> $GITHUB_OUTPUT
          exit 1

      - name: Notify deployment failure
        if: steps.azure_health.outputs.status == 'failed'
        run: |
          echo "⚠DEPLOYMENT A AZURE FALLÓ - Se requiere rollback manual"
          echo "Revisa los logs en Azure Portal"

  # ============================================
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-kubernetes-local, deploy-azure-production]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.deploy-kubernetes-local.result }}" == "success" ]; then
            echo "**Kubernetes Local:** Deployed successfully" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy-kubernetes-local.result }}" == "failure" ]; then
            echo "**Kubernetes Local:** Deployment failed" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Kubernetes Local:** Skipped" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.deploy-azure-production.result }}" == "success" ]; then
            echo "**Azure Production:** Deployed successfully" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy-azure-production.result }}" == "failure" ]; then
            echo "**Azure Production:** Deployment failed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭**Azure Production:** Skipped" >> $GITHUB_STEP_SUMMARY
          fi
