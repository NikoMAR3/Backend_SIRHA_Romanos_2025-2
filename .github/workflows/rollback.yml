name: Manual Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno donde hacer rollback'
        required: true
        type: choice
        options:
          - kubernetes-local
          - azure-production
      revision:
        description: 'Número de revisión (dejar vacío para rollback a anterior)'
        required: false
        type: string

jobs:
  rollback-kubernetes:
    name: Rollback Kubernetes
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'kubernetes-local'

    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Create kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_LOCAL }}" | base64 -d > $HOME/.kube/config

      - name: Rollback deployment
        run: |
          if [ -z "${{ github.event.inputs.revision }}" ]; then
            echo "Haciendo rollback a versión anterior..."
            kubectl rollout undo deployment/sirha-api -n sirha
          else
            echo "Haciendo rollback a revisión ${{ github.event.inputs.revision }}..."
            kubectl rollout undo deployment/sirha-api -n sirha --to-revision=${{ github.event.inputs.revision }}
          fi

      - name: Wait for rollback
        run: kubectl rollout status deployment/sirha-api -n sirha --timeout=5m

      - name: Verify rollback
        run: |
          echo "Rollback completado"
          kubectl get pods -n sirha

